<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>라이프 리스크 스캐너</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body style="background-color: #F9FAFB; margin: 0; font-family: -apple-system, sans-serif;">
    <div id="root"></div>
    <script type="text/babel">
        function TossRiskApp() {
          const [birth, setBirth] = React.useState('1992-04-21');
          const [time, setTime] = React.useState('00:20');
          const [loading, setLoading] = React.useState(false);
          const [result, setResult] = React.useState(null);

          const handleScan = () => {
            setLoading(true);
            setTimeout(() => {
              setLoading(false);
              setResult({
                score: 88,
                event: '2020년 3월 금융 대폭락 구간 핀포인트 일치',
                description: '재성(財星) 타격 및 관살 혼잡으로 인한 유동성 리스크 극대화 구간입니다.',
              });
            }, 800);
          };

          return (
            <div style={{ maxWidth: '480px', margin: '0 auto', padding: '24px', minHeight: '100vh' }}>
              <header style={{ marginBottom: '24px' }}>
                <h1 style={{ fontSize: '22px', fontWeight: 'bold', color: '#191F28' }}>라이프 리스크 스캐너</h1>
                <p style={{ fontSize: '14px', color: '#8B95A1' }}>과거 데이터 검증으로 다가올 위기를 차단합니다.</p>
              </header>

              <div style={{ backgroundColor: '#FFFFFF', padding: '20px', borderRadius: '16px', boxShadow: '0 4px 12px rgba(0,0,0,0.05)', marginBottom: '20px' }}>
                <label style={{ display: 'block', fontSize: '13px', fontWeight: '600', color: '#4E5968', marginBottom: '8px' }}>생년월일</label>
                <input 
                  type="date" 
                  value={birth} 
                  onChange={(e) => setBirth(e.target.value)}
                  style={{ width: '100%', padding: '12px', borderRadius: '8px', border: '1px solid #E5E8EB', fontSize: '16px', marginBottom: '16px', boxSizing: 'border-box' }}
                />

                <label style={{ display: 'block', fontSize: '13px', fontWeight: '600', color: '#4E5968', marginBottom: '8px' }}>출생 시간</label>
                <input 
                  type="time" 
                  value={time} 
                  onChange={(e) => setTime(e.target.value)}
                  style={{ width: '100%', padding: '12px', borderRadius: '8px', border: '1px solid #E5E8EB', fontSize: '16px', marginBottom: '20px', boxSizing: 'border-box' }}
                />

                <button 
                  onClick={handleScan}
                  style={{ width: '100%', backgroundColor: '#3182F6', color: '#FFFFFF', border: 'none', padding: '16px', borderRadius: '12px', fontSize: '16px', fontWeight: 'bold', cursor: 'pointer' }}
                >
                  {loading ? '0.1초 핀포인트 스캔 중...' : '과거 리스크 정확도 검증하기'}
                </button>
              </div>

              {result && (
                <div style={{ backgroundColor: '#FFFFFF', padding: '20px', borderRadius: '16px', border: '2px solid #3182F6' }}>
                  <h3 style={{ fontSize: '18px', color: '#191F28', marginBottom: '8px' }}>검증 완료 리포트</h3>
                  <p style={{ fontSize: '15px', fontWeight: 'bold', color: '#E54335', marginBottom: '8px' }}>위험 지수: {result.score}점</p>
                  <p style={{ fontSize: '14px', color: '#333D4B', marginBottom: '12px' }}>{result.event}</p>
                  <p style={{ fontSize: '13px', color: '#6B7684', backgroundColor: '#F2F4F6', padding: '12px', borderRadius: '8px' }}>{result.description}</p>
                  
                  <div style={{ marginTop: '20px', borderTop: '1px solid #E5E8EB', paddingTop: '16px' }}>
                    <p style={{ fontSize: '13px', color: '#4E5968', marginBottom: '12px' }}>전체 3년 치 상세 리스크 타임라인을 확인하려면 프리미엄 구독이 필요합니다.</p>
                    <button style={{ width: '100%', backgroundColor: '#10B981', color: '#FFFFFF', border: 'none', padding: '14px', borderRadius: '12px', fontSize: '15px', fontWeight: 'bold', cursor: 'pointer' }}>
                      토스로 월 9,900원 프리미엄 잠금 해제
                    </button>
                  </div>
                </div>
              )}
            </div>
          );
        }

        ReactDOM.render(<TossRiskApp />, document.getElementById('root'));
    </script>
</body>
</html>
